<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoga Postures Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A6741; /* Sage green */
            --primary-light: #F0F4EF;
            --bg-color: #F9FAFB;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .controls {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        input, select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        #poses-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .pose-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pose-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .pose-header {
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .pose-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase; /* Makes Posture Name ALL CAPS */
        }

        .pose-sanskrit {
            font-size: 1rem;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 0.25rem;
            text-transform: uppercase; /* Makes Sanskrit Name ALL CAPS */
        }

        .category-badge {
            display: inline-block;
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.75rem;
            text-transform: uppercase;
        }

        .detail-item {
            margin-bottom: 0.85rem;
            font-size: 0.875rem;
        }

        .detail-label {
            font-weight: 700;
            color: var(--text-main);
            display: block;
            margin-bottom: 0.15rem;
            text-transform: uppercase; /* Forces column names to be ALL CAPS */
            font-size: 0.8rem;
            letter-spacing: 0.025em;
        }

        .detail-value {
            color: var(--text-muted);
        }

        /* --- Custom Color & Bold Classes --- */
        .color-red { color: #DC2626 !important; font-weight: bold !important; }
        .color-blue { color: #2563EB !important; font-weight: bold !important; }
        .color-green { color: #059669 !important; font-weight: bold !important; }

        .error-message {
            text-align: center;
            color: #DC2626;
            background: #FEE2E2;
            padding: 1rem;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Yoga Postures Database</h1>
        <p>Interactive Asana Library for Teacher Training</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name, sanskrit, or muscle...">
        <select id="categoryFilter">
            <option value="All">All Categories</option>
        </select>
    </div>

    <div id="poses-container">
        <!-- Pose cards will be injected here by JavaScript -->
    </div>

    <script>
        let allPoses = [];

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Network response was not ok");
                
                allPoses = await response.json();
                initializeDashboard();
            } catch (error) {
                console.error("Failed to load JSON data:", error);
                document.getElementById('poses-container').innerHTML = `
                    <div class="error-message">
                        <h3>Error Loading Data</h3>
                        <p>Could not fetch <code>data.json</code>.</p>
                        <p>Make sure you are running a local web server (e.g., Live Server in VS Code) and that <code>data.json</code> is in the exact same folder as this HTML file.</p>
                    </div>`;
            }
        }

        function initializeDashboard() {
            populateCategoryFilter();
            renderPoses(allPoses);

            document.getElementById('searchInput').addEventListener('input', handleFilter);
            document.getElementById('categoryFilter').addEventListener('change', handleFilter);
        }

        function populateCategoryFilter() {
            const filterDropdown = document.getElementById('categoryFilter');
            const uniqueCategories = new Set();

            allPoses.forEach(pose => {
                if (pose["Family / Category"]) {
                    uniqueCategories.add(pose["Family / Category"]);
                }
            });

            Array.from(uniqueCategories).sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                filterDropdown.appendChild(option);
            });
        }

        function handleFilter() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filteredPoses = allPoses.filter(pose => {
                const matchesCategory = selectedCategory === "All" || pose["Family / Category"] === selectedCategory;
                const poseValuesString = Object.values(pose).join(" ").toLowerCase();
                const matchesSearch = poseValuesString.includes(searchTerm);

                return matchesCategory && matchesSearch;
            });

            renderPoses(filteredPoses);
        }

        function renderPoses(posesToRender) {
            const container = document.getElementById('poses-container');
            container.innerHTML = ''; 

            if (posesToRender.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #6B7280;">No postures found matching your criteria.</p>';
                return;
            }

            const detailColumns = [
                "Alignment", 
                "Key Actions", 
                "Safety / Contraindications", 
                "Accessibility (Modifications / Variations)", 
                "Benefits", 
                "Sequencing", 
                "Prep Postures", 
                "What Needs to be Opened", 
                "What Needs to be Engaged", 
                "Blueprint Pose & Related Postures / Variations", 
                "Common Misalignment"
            ];

            posesToRender.forEach(pose => {
                const card = document.createElement('div');
                card.className = 'pose-card';

                let cardHTML = `
                    <div class="pose-header">
                        <div class="pose-title">${pose["Posture Name"] || "Unknown Pose"}</div>
                        <div class="pose-sanskrit">${pose["Sanskrit"] || ""}</div>
                        <div class="category-badge">${pose["Family / Category"] || "Uncategorized"}</div>
                    </div>
                    <div class="pose-body">
                `;

                detailColumns.forEach(col => {
                    if (pose[col]) { 
                        // Determine if this specific column needs a custom color/bold class
                        let customClass = "detail-value";
                        if (col === "Common Misalignment") customClass += " color-red";
                        if (col === "Prep Postures") customClass += " color-blue";
                        if (col === "Benefits") customClass += " color-green";

                        cardHTML += `
                            <div class="detail-item">
                                <span class="detail-label">${col}:</span>
                                <span class="${customClass}">${pose[col]}</span>
                            </div>
                        `;
                    }
                });

                cardHTML += `</div>`;
                card.innerHTML = cardHTML;
                container.appendChild(card);
            });
        }

        loadData();
    </script>
</body>
</html>
