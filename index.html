<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoga Teacher Training 2026 | Asana Manual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --accent: #0d9488;
      --warning: #ef4444;
      --warning-bg: #fef2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 5rem;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1e1b4b;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1rem;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }
    .stats-bar {
      margin-top: 1.25rem;
      display: inline-flex;
      gap: 1.5rem;
      background: var(--primary-light);
      padding: 0.4rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }
    .main-container {
      max-width: 1300px;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: #ffffff;
      padding: 1.25rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }
    .search-box {
      flex: 2;
      min-width: 260px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .search-box svg {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--muted);
    }
    .select-box {
      flex: 1;
      min-width: 200px;
    }
    .select-box select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      outline: none;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -4px rgba(15, 23, 42, 0.08);
    }
    .card-top {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: #fdfdfd;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .card-top h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }
    .card-top .sanskrit {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
      margin-top: 0.15rem;
    }
    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: var(--primary-light);
      color: var(--primary);
      white-space: nowrap;
    }
    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
      font-size: 0.9rem;
    }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .anatomy-block {
      background: #f8fafc;
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px solid #edf2f7;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .anatomy-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .anatomy-row span.label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
    }
    .anatomy-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .anatomy-link {
      font-size: 0.75rem;
      text-decoration: none;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      font-weight: 500;
      transition: all 0.15s;
    }
    .anatomy-link:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .card-bottom {
      padding: 1rem 1.5rem;
      background: #fbfcfe;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .caution {
      color: #991b1b;
      background: var(--warning-bg);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .caution strong { color: #b91c1c; }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Yoga Teacher Training Manual (2026)</h1>
    <p>Comprehensive Asana Database: Alignment, Biomechanics, Cueing, Safety, and Functional Anatomy.</p>
    <div class="stats-bar">
      <span>64 Asanas</span>
      <span>•</span>
      <span>Complete Cueing</span>
      <span>•</span>
      <span>Interactive Anatomy</span>
    </div>
  </header>

  <div class="main-container">
    <div class="controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/></svg>
        <input type="text" id="searchInput" placeholder="Search pose, Sanskrit name, muscle, benefit, or misalignment..." />
      </div>
      <div class="select-box">
        <select id="categoryFilter">
          <option value="ALL">All Categories (64)</option>
        </select>
      </div>
    </div>

    <div class="grid" id="posesGrid"></div>
  </div>

  <script src="data.json" id="dataScript"></script>
  <script>
    // Directly fetch data.json or fallback to embedded
    fetch('data.json')
      .then(res => res.json())
      .then(data => initApp(data))
      .catch(() => {
        if (window.embeddedPoses) initApp(window.embeddedPoses);
      });

    function createMuscleLinks(text) {
      if (!text) return '<span style="color:#94a3b8; font-size:0.75rem;">None specified</span>';
      const items = text.split(/[,;]/).map(s => s.trim()).filter(Boolean);
      return items.map(item => {
        const cleanName = item.replace(/\(.*?\)/g, '').trim();
        const searchUrl = "https://en.wikipedia.org/wiki/" + encodeURIComponent(cleanName.replace(/ /g, "_"));
        return `<a href="${searchUrl}" target="_blank" rel="noopener noreferrer" class="anatomy-link">${item}</a>`;
      }).join('');
    }

    function initApp(poses) {
      const grid = document.getElementById('posesGrid');
      const searchInput = document.getElementById('searchInput');
      const categoryFilter = document.getElementById('categoryFilter');

      const categories = Array.from(new Set(poses.map(p => p['Family/Category']))).filter(Boolean).sort();
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        const count = poses.filter(p => p['Family/Category'] === cat).length;
        opt.textContent = `${cat} (${count})`;
        categoryFilter.appendChild(opt);
      });

      function renderCards(data) {
        grid.innerHTML = '';
        if (data.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <h3>No matching postures found</h3>
              <p>Try searching for a different Sanskrit name, cue, or muscle group.</p>
            </div>
          `;
          return;
        }

        data.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-top">
              <div>
                <h3>${p['Posture Name']}</h3>
                <div class="sanskrit">${p['Sanskrit']}</div>
              </div>
              <span class="tag">${(p['Family/Category'] || '').split('/')[0].trim()}</span>
            </div>

            <div class="card-content">
              <div>
                <div class="section-label">Alignment</div>
                <p>${p['Alignment'] || '—'}</p>
              </div>

              <div>
                <div class="section-label">Key Actions</div>
                <p>${p['Key Actions'] || '—'}</p>
              </div>

              <div class="anatomy-block">
                <div class="anatomy-row">
                  <span class="label">OPENED (TARGET STRETCH):</span>
                  <div class="anatomy-links">${createMuscleLinks(p['What needs to be Opened'])}</div>
                </div>
                <div class="anatomy-row">
                  <span class="label">ENGAGED (STRENGTH / STABILIZATION):</span>
                  <div class="anatomy-links">${createMuscleLinks(p['What needs to be Engaged'])}</div>
                </div>
              </div>

              <div>
                <div class="section-label">Modifications & Accessibility</div>
                <p>${p['Accessibility (Modifications/Variations)'] || '—'}</p>
              </div>

              <div>
                <div class="section-label">Common Misalignment</div>
                <p style="color:#b45309;">${p['Common Misalignment'] || '—'}</p>
              </div>
            </div>

            <div class="card-bottom">
              <div class="caution">
                <strong>Caution:</strong> ${p['Safety/Contraindications'] || 'None'}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function filterData() {
        const q = searchInput.value.toLowerCase().trim();
        const cat = categoryFilter.value;

        const filtered = poses.filter(p => {
          const matchesCat = (cat === 'ALL' || p['Family/Category'] === cat);
          const matchesQuery = 
            (p['Posture Name'] && p['Posture Name'].toLowerCase().includes(q)) ||
            (p['Sanskrit'] && p['Sanskrit'].toLowerCase().includes(q)) ||
            (p['Alignment'] && p['Alignment'].toLowerCase().includes(q)) ||
            (p['Key Actions'] && p['Key Actions'].toLowerCase().includes(q)) ||
            (p['Benefits'] && p['Benefits'].toLowerCase().includes(q)) ||
            (p['What needs to be Opened'] && p['What needs to be Opened'].toLowerCase().includes(q)) ||
            (p['What needs to be Engaged'] && p['What needs to be Engaged'].toLowerCase().includes(q)) ||
            (p['Common Misalignment'] && p['Common Misalignment'].toLowerCase().includes(q));

          return matchesCat && matchesQuery;
        });

        renderCards(filtered);
      }

      searchInput.addEventListener('input', filterData);
      categoryFilter.addEventListener('change', filterData);

      renderCards(poses);
    }
  </script>
</body>
</html>
